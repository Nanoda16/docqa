name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Run backend security & API tests
        run: python -m pytest backend/tests -q

  ai-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AI core test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic pydantic-settings sse-starlette faiss-cpu jieba rank-bm25 numpy openai python-dotenv pypdf python-docx pytest
      - name: Run AI service RAG unit tests
        run: python -m pytest ai_service/tests -q

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
